<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacy AI Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 400px;
            height: 600px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .chat-header h2 {
            margin: 0;
            font-size: 20px;
        }

        .chat-status {
            font-size: 12px;
            margin-top: 5px;
            opacity: 0.9;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f5f5f5;
        }

        .message {
            margin-bottom: 15px;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            text-align: right;
        }

        .message-bubble {
            display: inline-block;
            padding: 12px 16px;
            border-radius: 18px;
            max-width: 80%;
            word-wrap: break-word;
        }

        .message.user .message-bubble {
            background: #667eea;
            color: white;
        }

        .message.ai .message-bubble {
            background: white;
            color: #333;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .suggestions {
            margin-top: 10px;
        }

        .suggestion-card {
            background: white;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            font-size: 13px;
        }

        .suggestion-card strong {
            color: #667eea;
        }

        .disclaimer {
            font-size: 11px;
            color: #666;
            margin-top: 8px;
            font-style: italic;
        }

        .chat-input-container {
            padding: 15px;
            background: white;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 25px;
            outline: none;
            font-size: 14px;
        }

        .chat-input:focus {
            border-color: #667eea;
        }

        .send-button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .send-button:hover {
            background: #5568d3;
            transform: scale(1.05);
        }

        .send-button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: scale(1);
        }

        .typing-indicator {
            display: none;
            padding: 10px;
            color: #666;
            font-style: italic;
            font-size: 13px;
        }

        .typing-indicator.active {
            display: block;
        }
    </style>
</head>

<body>
    <div class="chat-container">
        <div class="chat-header">
            <h2>💊 Pharmacy AI Assistant</h2>
            <div class="chat-status" id="aiStatus">AI Ready</div>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="message ai">
                <div class="message-bubble">
                    Hey there! 👋 I'm your pharmacy assistant. What can I help you find today?
                </div>
            </div>
        </div>
        <div class="typing-indicator" id="typingIndicator">
            AI is thinking...
        </div>
        <div class="chat-input-container">
            <input type="text" class="chat-input" id="messageInput" placeholder="Ask me anything..." maxlength="500">
            <button class="send-button" id="sendButton">Send</button>
        </div>
    </div>
    <script>
        const API_URL = 'http://localhost:3000/api/ai/ask';
        const messagesContainer = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const typingIndicator = document.getElementById('typingIndicator');
        const aiStatus = document.getElementById('aiStatus');
        // Send message
        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;
            // Add user message
            addMessage(message, 'user');
            messageInput.value = '';
            sendButton.disabled = true;
            typingIndicator.classList.add('active');
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });
                const data = await response.json();
                if (data.success) {
                    // Update AI status
                    if (data.data.usedGemini) {
                        aiStatus.textContent = '🤖 Gemini AI Active';
                        aiStatus.style.color = '#4ade80';
                    } else {
                        aiStatus.textContent = '⚡ Quick Response Mode';
                        aiStatus.style.color = '#fbbf24';
                    }
                    // Add AI response
                    addMessage(
                        data.data.response,
                        'ai',
                        data.data.suggestions,
                        data.data.disclaimer
                    );
                } else {
                    addMessage('Sorry, something went wrong. Please try again.', 'ai');
                }
            } catch (error) {
                console.error('Error:', error);
                addMessage('Network error. Is the backend running on port 3000?', 'ai');
            } finally {
                typingIndicator.classList.remove('active');
                sendButton.disabled = false;
                messageInput.focus();
            }
        }
        // Add message to chat
        function addMessage(text, sender, suggestions = [], disclaimer = null) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            let html = `<div class="message-bubble">${text}</div>`;
            // Add suggestions
            if (suggestions && suggestions.length > 0) {
                html += '<div class="suggestions">';
                suggestions.forEach(item => {
                    html += `
                        <div class="suggestion-card">
                            <strong>${item.name}</strong> - $${item.price}<br>
                            ${item.inStock ? '✅ In Stock' : '❌ Out of Stock'}
                            ${item.requiresPrescription ? ' | 🔒 Prescription Required' : ''}
                        </div>
                    `;
                });
                html += '</div>';
            }
            // Add disclaimer
            if (disclaimer) {
                html += `<div class="disclaimer">${disclaimer}</div>`;
            }
            messageDiv.innerHTML = html;
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
        // Event listeners
        sendButton.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
        // Focus input on load
        messageInput.focus();
    </script>
</body>

</html>
